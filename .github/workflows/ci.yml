name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest runners.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Build and test the Synthea loader
        run: ./mvnw -B -ntp -f tools/loader/pom.xml verify
